      let analytics = null;
      let visitDispatched = null;
      try {
        analytics = createPwaAnalytics({ send: async events => {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
          try {
          const response = await fetch('/api/web_pwa_statistics', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Origin': entryUrl.origin },
            credentials: 'include',
            keepalive: true,
            body: JSON.stringify({ schema_version: 1, events }),
            signal: controller.signal,
          });
          if (!response.ok) {
            const error = new Error('Statistics HTTP failure');
            error.response = { status: response.status, headers: { 'retry-after': response.headers.get('Retry-After') } };
            throw error;
          }
          const payload = await response.json();
          if (payload?.code !== 200) throw new Error('invalid_statistics_response');
          return payload.data;
          } finally { clearTimeout(timer); }
        }});
        analytics.initialize();
        // Capture the visit time before detail resolves; the binding IDs come only from detail.
        visitDispatched = analytics.track('landing_view', { waitForDispatch: true });
      } catch (_) {
        // Optional statistics must never prevent entry to H5.
        analytics = null;
      }

      async function waitForVisitDispatch() {
        if (!visitDispatched) return;
        let deadline;
        try {
          await Promise.race([
            visitDispatched,
            new Promise(resolve => { deadline = setTimeout(resolve, 200); }),
          ]);
        } catch (_) {
          // Continue even if storage or transport is unavailable.
        } finally { clearTimeout(deadline); }
      }

      function buildHeaders() {
        const headers = new Headers({ lang: 'US', 'X-Os': 'web', 'X-Origin': entryUrl.origin });
        if (incoming.size) headers.set('X-Landing-Params', incoming.toString());
        return headers;
      }
      function targetUrl(detail) {
        const raw = meaningful(detail?.h5_url) || meaningful(detail?.h5Url);
        if (!raw) throw new Error('Missing H5 address');
        const target = new URL(raw);
        if (!['https:', 'http:'].includes(target.protocol) || target.username || target.password) throw new Error('Invalid H5 address');
        if (target.origin === entryUrl.origin && target.pathname === entryUrl.pathname) throw new Error('Redirect loop');
        overlay(target.searchParams, incoming);
        return target.href;
      }
      async function request() {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
        try {
          let response;
          try {
            response = await fetch(API_URL, { method: 'GET', headers: buildHeaders(), credentials: 'include', cache: 'no-store', signal: controller.signal });
          } catch (error) {
            error.retryable = true;
            throw error;
          }
          if (!response.ok) {
            const error = new Error('HTTP failure');
            error.retryable = response.status >= 500 && response.status <= 599;
            throw error;
          }
          let payload;
          try { payload = await response.json(); } catch (error) {
            if (error.name === 'AbortError') throw error;
            throw new Error('Invalid JSON');
          }
          if (payload && typeof payload.code !== 'undefined') {
            if (![1, 200, 201, 204].includes(Number(payload.code))) throw new Error('Business failure');
            payload = payload.data;
          }
          const destination = targetUrl(payload);
          try { analytics?.updateConfig(payload); } catch (_) {}
          return destination;
        } catch (error) {
          if (error.name === 'AbortError') error.retryable = true;
          throw error;
        } finally { clearTimeout(timer); }
      }
      const loading = document.getElementById('loading');
      const failure = document.getElementById('failure');
      const status = document.getElementById('status');
      let running = false;
      let navigated = false;
      async function run() {
        if (running || navigated) return;
        running = true;
        loading.hidden = false;
        failure.hidden = true;
        status.setAttribute('aria-busy', 'true');
        try {
          for (let attempt = 0; ; attempt++) {
            let destination;
            try { destination = await request(); } catch (error) {
              if (!error.retryable || attempt >= RETRY_DELAYS.length) throw error;
              await new Promise(resolve => setTimeout(resolve, RETRY_DELAYS[attempt]));
              continue;
            }
            await waitForVisitDispatch();
            window.location.replace(destination);
            navigated = true;
            break;
          }
        } catch (_) {
          loading.hidden = true;
          failure.hidden = false;
          status.setAttribute('aria-busy', 'false');
        } finally { running = false; }
      }
      document.getElementById('retry').addEventListener('click', run);
      void run();
    })();
  </script>
</body>
</html>
