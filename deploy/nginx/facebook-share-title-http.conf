# Include once inside nginx.conf's http {} block, before the site includes.
# Keep the hostname (including subdomains) except its last dot-separated suffix.
# ASCII hostname matching keeps the substituted HTML attribute safe.
map $host $pwa_facebook_title {
    default "";
    "~^(?<pwa_fb_label>[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)*)\.[a-z]{2,63}$" "Online Slots at $pwa_fb_label| 700+ Real Money Slot Games";
}
