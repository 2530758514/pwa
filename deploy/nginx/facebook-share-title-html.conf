# Include inside the site's existing location = /index.html {} block.
# Only HTML is filtered by default. Keep APIs, JS, SW and manifests unchanged.
sub_filter 'property="og:title" content=""' 'property="og:title" content="$pwa_facebook_title"';
sub_filter '<title></title>' '<title>$pwa_facebook_title</title>';
sub_filter_once on;
sub_filter_last_modified off;
etag off;
if_modified_since off;
