<!doctype html>
<html lang="en">
  <head>
    <script>
      ;(function () {
        var playerSessionEnabled =
          String('%VITE_PLAYER_SESSION_ENABLED%').toLowerCase() === 'true'
        var playerIdentityEnabled =
          !playerSessionEnabled &&
          String('%VITE_PLAYER_IDENTITY_ENABLED%').toLowerCase() === 'true'

        if (!playerIdentityEnabled) {
          document.documentElement.classList.add('player-identity-disabled')
          return
        }

        var configuredPath = '%VITE_PLAYER_IDENTITY_CALLBACK_PATH%'
        var callbackPath =
          configuredPath &&
          configuredPath.charAt(0) === '/' &&
          configuredPath.slice(0, 2) !== '//' &&
          configuredPath.indexOf('?') === -1 &&
          configuredPath.indexOf('#') === -1
            ? configuredPath.replace(/\/+$/, '') || '/'
            : '/'

        if ((window.location.pathname.replace(/\/+$/, '') || '/') !== callbackPath) return

        var fragment = window.location.hash.slice(1)
        if (!isHandoffCallbackFragment(fragment)) return

        window.__PWA_PLAYER_IDENTITY_CALLBACK_ACTIVE__ = true
        window.__PWA_PLAYER_IDENTITY_HANDOFF_CALLBACK_FRAGMENT__ = fragment

        window.history.replaceState(null, '', window.location.pathname + window.location.search)

        function isHandoffCallbackFragment(rawFragment) {
          var params = new URLSearchParams(rawFragment)
          var allowedFields = {
            handoff_grant: true,
            handoff_action: true,
            error: true,
            state: true,
          }
          var values = {}

          for (var entry of params.entries()) {
            var name = entry[0]
            var value = entry[1]

            if (!allowedFields[name] || Object.prototype.hasOwnProperty.call(values, name)) {
              return false
            }

            values[name] = value
          }

          var resultFields = ['handoff_grant', 'error'].filter(function (name) {
            return Object.prototype.hasOwnProperty.call(values, name)
          })

          if (
            resultFields.length !== 1 ||
            !/^[A-Za-z0-9_-]{43,128}$/.test(values.state || '')
          ) {
            return false
          }
          if (values.error) {
            return Object.keys(values).length === 2 && values.error === 'identity_not_available'
          }

          return (
            Object.keys(values).length === 3 &&
            /^[a-f0-9]{64}$/.test(values.handoff_grant || '') &&
            ['exchange', 'provision'].includes(values.handoff_action)
          )
        }
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" href="/pwa-icons/icon-192.png" sizes="any" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #000000;
      }

      #app {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .identity-first-paint {
        position: fixed;
        inset: 0;
        z-index: 1000300;
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        opacity: 1;
        color: #fff;
        background: #000000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        transition: opacity 160ms ease;
      }

      .player-identity-disabled .identity-first-paint {
        display: none;
      }

      .identity-first-paint--leaving {
        opacity: 0;
        pointer-events: none;
      }

      .identity-first-paint__visual {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: min(6.4vw, 24px);
      }

      .identity-first-paint__dots {
        width: min(13.333333vw, 50px);
        aspect-ratio: 4;
        --identity-dot: no-repeat radial-gradient(circle closest-side, #27ae60 90%, #0000);
        background:
          var(--identity-dot) 0% 50%,
          var(--identity-dot) 50% 50%,
          var(--identity-dot) 100% 50%;
        background-size: calc(100% / 3) 100%;
        animation: identity-first-paint-dots 1s infinite linear;
      }

      @keyframes identity-first-paint-dots {
        33% {
          background-size:
            calc(100% / 3) 0%,
            calc(100% / 3) 100%,
            calc(100% / 3) 100%;
        }

        50% {
          background-size:
            calc(100% / 3) 100%,
            calc(100% / 3) 0%,
            calc(100% / 3) 100%;
        }

        66% {
          background-size:
            calc(100% / 3) 100%,
            calc(100% / 3) 100%,
            calc(100% / 3) 0%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .identity-first-paint {
          transition: none;
        }

        .identity-first-paint__dots {
          animation: none;
        }
      }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="application-name" content="SlotFront H5" />
    <meta name="apple-mobile-web-app-title" content="SlotFront H5" />
    <link rel="preconnect" href="https://static.gold7p.com" crossorigin />
    <link rel="dns-prefetch" href="//static.gold7p.com" />
    <link rel="apple-touch-icon" href="/pwa-icons/icon-192.png" />
    <title>SlotFront H5</title>
  </head>
  <body>
    <div id="app"></div>
    <main
      id="identity-bootstrap-loading"
      class="identity-first-paint"
      aria-live="polite"
      aria-label="Loading"
    >
      <div class="identity-first-paint__visual">
        <span class="identity-first-paint__dots" aria-hidden="true"></span>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
